#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "wanderer"
name = "Wanderer"
description.en = "Self-hosted trail database. Save your adventures! "
description.fr = "Base de données de trails auto-hébergée. Sauvegardez vos aventures !"

version = "0.21.2~ynh2"

maintainers = ["Thovi98"]

[upstream]
license = "AGPL-3.0"
website = "https://wanderer.to/"
demo = "https://demo.wanderer.to/"
admindoc = "https://wanderer.to/getting-started/installation/"
userdoc = "https://wanderer.to/"
code = "https://github.com/open-wanderer/wanderer"
fund = "https://buymeacoffee.com/wanderertrails"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "1G"
ram.build = "2G"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    
    [install.admin]
    type = "user"
    help.en = "You will be able to login for admin stuffs with the email of this user and the password you’ll set below."
    help.fr = "Vous pourrez vous connecter pour les tâches d’administrateur avec l’adresse courriel de cet utilisateur et le mot de passe configuré ci-dessous."

    [install.password]
    help.en = "Choose a password for your admin user here."
    help.fr = "Choisissez un mot de passe pour l’utilisateur admin ici."
    type = "password"

    [install.disable_signup]
    ask.en = "Enable sign up?"
    ask.fr = "Autoriser les inscriptions ?"
    type = "boolean"

    [install.private]
    ask.en = "Make the instance private?"
    ask.fr = "Rendre l’instance privée ?"
    help.en = "Setting this to true will block visitors from viewing content without an account"
    type = "boolean"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/open-wanderer/wanderer/archive/aa5d995dfde00b4557e9cb6ad5141382a04b2ee3.tar.gz"
    sha256 = "9306f3d230ca5fe39db25c53d2bf8dabf4f4bb9bd574630ddbbc35ca82bf02bf"
    
    autoupdate.strategy = "latest_github_release"

    [resources.sources.plugin_hammerhead]
    url = "https://github.com/open-wanderer/wanderer/releases/download/v0.21.2/wanderer-plugin-hammerhead.tar.gz"
    sha256 = "190bce13d11429ddfd99d2dfa85e862fcff85d56735d139bcb0ec699faa99dfa"

    in_subdir = false
    
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = ".*hammerhead.tar.gz"


    [resources.sources.plugin_komoot]
    url = "https://github.com/open-wanderer/wanderer/releases/download/v0.21.2/wanderer-plugin-komoot.tar.gz"
    sha256 = "4ce259b8ec1a87d34ffaaa056ee32e03b6cfcacd88d3fbf3daac640b157fdb1a"

    in_subdir = false
    
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = ".*komoot.tar.gz"

    [resources.sources.plugin_strava]
    url = "https://github.com/open-wanderer/wanderer/releases/download/v0.21.2/wanderer-plugin-strava.tar.gz"
    sha256 = "9a2950082a8b2a6c1093db66899fe90fef09e6a80ab2f339c77becb5bacfe77b"

    in_subdir = false
    
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = ".*strava.tar.gz"

    [resources.sources.meili]
    amd64.url = "https://github.com/meilisearch/meilisearch/releases/download/v1.56.0/meilisearch-linux-amd64"
    amd64.sha256 = "5a32e1d7a6a69e0ee5634a7456c421f59273d73f078b6f0d8f01384eafe79729"
    arm64.url = "https://github.com/meilisearch/meilisearch/releases/download/v1.56.0/meilisearch-linux-aarch64"
    arm64.sha256 = "fcb2699f0bea994cdaf02064add2a4b1656a9aae3a3ee6ea7fd0d61575f19174"
    rename = "meilisearch"
    in_subdir = false
    extract = false

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/meilisearch/meilisearch"
    autoupdate.asset.amd64 = "^meilisearch-linux-amd64$"
    autoupdate.asset.arm64 = "^meilisearch-linux-aarch64$"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]
    subdirs = [ "uploads"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    pocketbase.url = "/admin"
    pocketbase.allowed = "admins"
    pocketbase.show_tile = false
    pocketbase.protected = true
    pocketbase.auth_header = false

    api.url = "/api/v1"
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = false
    api.auth_header = false

    [resources.ports]
    meili.default = 7700
    pocketbase.default = 8090

    [resources.nodejs]
    version = "22"

    [resources.go]
    version = "1.26.0"
