#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "wanderer"
name = "Wanderer"
description.en = "Self-hosted trail database. Save your adventures! "
description.fr = "Base de données de trails auto-hébergée. Sauvegardez vos aventures !"

version = "0.21.0~ynh3"

maintainers = ["Thovi98"]

[upstream]
license = "AGPL-3.0"
website = "https://wanderer.to/"
demo = "https://demo.wanderer.to/"
admindoc = "https://wanderer.to/getting-started/installation/"
userdoc = "https://wanderer.to/"
code = "https://github.com/open-wanderer/wanderer"
fund = "https://buymeacoffee.com/wanderertrails"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "1G"
ram.build = "2G"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    
    [install.admin]
    type = "user"
    help.en = "You will be able to login for admin stuffs with the email of this user and the password you’ll set below."
    help.fr = "Vous pourrez vous connecter pour les tâches d’administrateur avec l’adresse courriel de cet utilisateur et le mot de passe configuré ci-dessous."

    [install.password]
    help.en = "Choose a password for your admin user here."
    help.fr = "Choisissez un mot de passe pour l’utilisateur admin ici."
    type = "password"

    [install.disable_signup]
    ask.en = "Enable sign up?"
    ask.fr = "Autoriser les inscriptions ?"
    type = "boolean"

    [install.private]
    ask.en = "Make the instance private?"
    ask.fr = "Rendre l’instance privée ?"
    help.en = "Setting this to true will block visitors from viewing content without an account"
    type = "boolean"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/open-wanderer/wanderer/archive/5cd1b62ad33026e7a01a50ab92397cb207acf789.tar.gz"
    sha256 = "995c8d82867c4f51c8c70a51b0a1407ca34a983357b248058d047dc415ad27ef"
    autoupdate.strategy = "latest_github_tag"

    [resources.sources.meili]
    amd64.url = "https://github.com/meilisearch/meilisearch/releases/download/v1.54.2/meilisearch-linux-amd64"
    amd64.sha256 = "fb881e0b13aeac2c40b423a69c501b479b4abb1032d7f057efbe1fa32a99225b"
    arm64.url = "https://github.com/meilisearch/meilisearch/releases/download/v1.54.2/meilisearch-linux-aarch64"
    arm64.sha256 = "757bf3c18bc629234ca724b1b2b845eb937a84b9a717c3599bc7a56d47941781"
    rename = "meilisearch"
    in_subdir = false
    extract = false

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/meilisearch/meilisearch"
    autoupdate.asset.amd64 = "^meilisearch-linux-amd64$"
    autoupdate.asset.arm64 = "^meilisearch-linux-aarch64$"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]
    subdirs = [ "uploads"]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    pocketbase.url = "/admin"
    pocketbase.allowed = "admins"
    pocketbase.show_tile = false
    pocketbase.protected = true
    pocketbase.auth_header = false

    api.url = "/api/v1"
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = false
    api.auth_header = false

    [resources.ports]
    meili.default = 7700
    pocketbase.default = 8090

    [resources.nodejs]
    version = "22"

    [resources.go]
    version = "1.26.0"
